name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Audit #2: production serves a baked snapshot; without a refresh cadence
    # gauges, warnings and AQI go stale between pushes — unacceptable during
    # flood and haze season. Rebuild every 30 minutes from the default branch
    # (off the :00/:30 marks to dodge GitHub's congested cron slots).
    - cron: "13,43 * * * *"

# Never run two builds/deploys at once — a push racing the cron would publish
# two snapshots out of order.
concurrency:
  group: kuching-ioc-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci || npm install
      # Audit #6: tests must gate the deploy — a green test suite is the
      # minimum acceptance threshold before bytes reach the live site.
      - name: Run tests
        run: node --test tests/*.test.mjs
      # Pull requests prove the suite. Baking and publishing stay on main,
      # schedule, and manual dispatch so a PR cannot replace the live snapshot.
      - name: Build snapshot
        if: github.event_name != 'pull_request'
        run: node build.mjs
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=kuching-ioc --branch=main
