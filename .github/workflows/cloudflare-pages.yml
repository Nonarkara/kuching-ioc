name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Audit #2: production serves a baked snapshot; without a refresh cadence
    # gauges, warnings and AQI go stale between pushes — unacceptable during
    # flood and haze season. GitHub Actions guarantees scheduled workflows run
    # at most once every 5 min but de-duplicates aggressively in practice; the
    # observed cadence is 3–5 h. Tune to that reality so the comment matches
    # what the operator actually sees in the Actions log.
    - cron: "13 */4 * * *"

# Never run two builds/deploys at once — a push racing the cron would publish
# two snapshots out of order.
concurrency:
  group: kuching-ioc-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      # Audit #6: tests must gate the deploy — a green test suite is the
      # minimum acceptance threshold before bytes reach the live site.
      - name: Run tests
        run: node --test tests/*.test.mjs
      # MSH (docs/MSH-LAW.md): spatial measurement, recorded NOT enforced.
      #
      # This board renders wall-clock-relative strings ("10 min ago", "12 min
      # ago") and completes weather live in the visitor's browser, so two runs
      # of the SAME build measure different geometry. A gate over a moving
      # target flaps, and a gate that blocks deploys on its own nondeterminism
      # gets switched off. So it measures and uploads the receipt as an
      # artifact; it does not fail the build yet.
      #
      # To make it enforce, the board needs a deterministic measurement mode:
      # freeze the clock and serve a snapshot that never self-completes. Until
      # then, run it locally with --baseline and read the diff by hand.
      - name: Spatial measurement (MSH, advisory)
        continue-on-error: true
        run: >
          node scripts/spatial/spatial-check.mjs
          --dir public
          --baseline design/spatial-baseline.json
          --widths 390,479,480,481,719,720,721,722,959,960,961,1024,1039,1040,1041,1042,1239,1240,1241,1399,1400,1401,1440,1499,1500,1501
          --report --json artifacts/spatial-report.json
      - name: Upload spatial receipt
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: spatial-report
          path: artifacts/spatial-report.json
          if-no-files-found: ignore
      # Pull requests prove the suite. Baking and publishing stay on main,
      # schedule, and manual dispatch so a PR cannot replace the live snapshot.
      - name: Build snapshot
        if: github.event_name != 'pull_request'
        env:
          # Optional source credentials. None are required for the dashboard to
          # build — every loader has an honest "unavailable" fallback — but
          # setting them upgrades specific sources to live:
          #   FIRMS_MAP_KEY: NASA FIRMS live hotspot CSV (Sarawak/Malaysia).
          #   AQICN_TOKEN:   WAQI mirror of DOE APIMS (Sarawak AQI).
          #   VISITOR_BEACON_URL: Apps Script endpoint for visitor analytics
          #                       (defaults to empty → fire-and-forget).
          # Secrets are configured under Settings → Secrets and variables →
          # Actions in the GitHub repository; they never enter source.
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          AQICN_TOKEN: ${{ secrets.AQICN_TOKEN }}
          VISITOR_BEACON_URL: ${{ secrets.VISITOR_BEACON_URL }}
        run: node build.mjs
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=kuching-ioc --branch=main
