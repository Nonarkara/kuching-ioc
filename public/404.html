<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Greater Kuching IOC</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        --bg: #f6f5f2;
        --ink: #16181c;
        --soft: #525864;
        --line: #d4d7de;
        --accent: #1b3fa0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111419;
          --ink: #eef1f5;
          --soft: #9aa3b2;
          --line: #2a303c;
          --accent: #6c92ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      main {
        width: min(100%, 440px);
        border-top: 3px solid var(--accent);
        padding-top: 16px;
      }
      .code {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 4px 0 10px;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 700;
      }
      p {
        margin: 0 0 8px;
        color: var(--soft);
        font-size: 14px;
      }
      .actions {
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
      a:hover, a:focus-visible { text-decoration: underline; }
      a.primary {
        display: inline-block;
        padding: 8px 14px;
        background: var(--accent);
        color: #ffffff;
      }
      a.primary:hover, a.primary:focus-visible {
        text-decoration: none;
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 · Greater Kuching IOC</p>
      <h1>Page not found</h1>
      <p>The path you requested does not exist on this static board.</p>
      <p lang="ms">Halaman yang diminta tidak wujud pada papan statik ini.</p>
      <p lang="zh">您请求的页面在此静态看板上不存在。</p>
      <div class="actions">
        <a class="primary" href="/">Return to board</a>
        <a href="/health.json">Status (health.json)</a>
      </div>
    </main>
  </body>
</html>
